<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HarshitGPT Chatbot</title>
    <!-- Pulling in core Spider-Verse styles and fonts -->
    <link rel="stylesheet" href="style.css">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        .chat-container-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            padding: 20px var(--gutter);
        }

        .chat-app {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            border: 6px solid #fff;
            background-color: var(--ink-black);
            box-shadow: 12px 12px 0 var(--spider-red);
            clip-path: polygon(1% 0, 99% 1%, 100% 99%, 0 100%);
            position: relative;
            z-index: 1;
        }

        .chat-header {
            padding: 20px 25px;
            background-color: var(--ink-black);
            border-bottom: 6px solid #fff;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-header-title {
            font-size: 3.5rem;
            margin: 0;
            text-shadow: 3px 3px 0 var(--spider-purple);
            text-align: center;
        }

        .chat-box {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
            /* Translucent dark overlay with comic slashes */
            background: repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6) 10px, rgba(20, 20, 20, 0.5) 10px, rgba(20, 20, 20, 0.5) 20px);
        }

        .chat-box::-webkit-scrollbar {
            width: 12px;
        }

        .chat-box::-webkit-scrollbar-track {
            background: var(--ink-black);
            border-left: 4px solid #fff;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background-color: #fff;
        }

        .chat-message {
            display: flex;
            max-width: 85%;
            animation: fadeInMessage 0.3s ease-in-out;
        }

        @keyframes fadeInMessage {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .chat-message .message-content {
            padding: 15px 25px;
            border: 4px solid #fff;
            background: var(--ink-black);
            color: #fff;
            font-family: 'Space Mono', monospace;
            font-size: 1.1rem;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
            position: relative;
        }

        /* User Message */
        .chat-message.user {
            align-self: flex-end;
        }

        .chat-message.user .message-content {
            box-shadow: 8px 8px 0 var(--spider-green);
            transform: rotate(-1.5deg);
            clip-path: polygon(0 2%, 100% 0, 98% 100%, 2% 98%);
        }

        /* AI Message */
        .chat-message.ai {
            align-self: flex-start;
        }

        .chat-message.ai .message-content {
            box-shadow: 8px 8px 0 var(--spider-blue);
            transform: rotate(1.5deg);
            clip-path: polygon(2% 0, 98% 2%, 100% 98%, 0 100%);
        }

        .blinking-cursor::after {
            content: '▍';
            animation: blink 1s step-end infinite;
            display: inline-block;
            margin-left: 5px;
            color: var(--spider-red);
        }

        @keyframes blink {

            from,
            to {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .chat-input-area {
            display: flex;
            padding: 20px;
            background-color: var(--ink-black);
            border-top: 6px solid #fff;
            flex-shrink: 0;
            gap: 20px;
            align-items: center;
        }

        #user-input {
            flex-grow: 1;
            background-color: var(--ink-black);
            border: 4px solid #fff;
            padding: 15px 20px;
            font-size: 1.2rem;
            font-family: 'Space Mono', monospace;
            color: #fff;
            outline: none;
            transition: box-shadow 0.2s ease, transform 0.2s ease;
            box-shadow: 6px 6px 0 var(--spider-blue);
        }

        #user-input:focus {
            box-shadow: 10px 10px 0 var(--spider-purple);
            transform: translate(-3px, -3px);
        }

        #user-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .send-btn-wrapper {
            flex-shrink: 0;
        }

        /* Overrides for mobile readability */
        @media (max-width: 768px) {
            .chat-app {
                height: 95vh;
                border-width: 4px;
            }

            .chat-header-title {
                font-size: 2.5rem;
            }

            .chat-message {
                max-width: 95%;
            }

            .chat-message .message-content {
                font-size: 1rem;
                padding: 12px 15px;
            }

            #user-input {
                padding: 12px 15px;
                font-size: 1rem;
            }

            .chat-input-area {
                padding: 15px;
                gap: 10px;
            }

            .slanted-btn {
                padding: 10px 15px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>
    <!-- Spider-Verse Base Backgrounds inherited exactly from style.css -->
    <div class="background-dots"></div>
    <div class="background-dots-glitch"></div>

    <div class="chat-container-wrapper">
        <div class="chat-app panel">
            <div class="chat-header">
                <h1 class="chat-header-title action-font glitch" data-text="HarshitGPT">HarshitGPT</h1>
            </div>

            <div class="chat-box" id="chat-box"></div>

            <div class="chat-input-area">
                <input type="text" id="user-input" placeholder="Ask a question..." autocomplete="off" autofocus>
                <div class="send-btn-wrapper">
                    <!-- Standard Slanted action button styling mapped from the core theme -->
                    <button id="send-btn" class="slanted-btn green-shadow" title="Send Message"
                        style="border: 4px solid #fff;">
                        <span class="btn-text action-font glitch" data-text="SEND"
                            style="font-size: 1.6rem; letter-spacing: 1px;">SEND</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Original HarshitGPT Logic preserved entirely, with Spider-Verse mouse tracking injected -->
    <script src="apikey.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Interactive background glitch effect linked up!
            document.addEventListener('mousemove', (e) => {
                const glitchLayer = document.querySelector('.background-dots-glitch');
                if (glitchLayer) {
                    glitchLayer.style.setProperty('--mouse-x', e.clientX + 'px');
                    glitchLayer.style.setProperty('--mouse-y', e.clientY + 'px');
                }
            });

            // Cloudflare Worker URL (Replace with your actual deployed worker URL once deployed!)
            const WORKER_URL = "https://harshitgpt.harshitperiwal123.workers.dev/";
            const MODEL_NAME = 'gemini-2.5-flash';
            const systemPrompt = `You are "HarshitGPT," an AI trained by google and fine tuned by Harshit Periwal. This model is developed and hosted on Harshit Periwal’s official website — harshitperiwal.in. You were built to answer questions about Harshit and his work. Harshit Periwal is a Grade 12 student from Nagpur, India, with a strong passion for Computer Science, Artificial Intelligence, and 3D art. He aims to use AI to make technology more accessible globally. He has: - Developed "Eco Bin," an AI-based waste segregation app. - He is his school's AI Captain, where he teaches weekly about AI tools and helped integrate iPads into classrooms. - Created two apps and one game. - Secured a Top 50 All India Rank in the Future Tech Olympiad with IBM. - Ranked in the top 50 nationally in the Future Tech Olympiad out of 50,000+ students. - Placed 2nd in the Cenfest Codeathon and was the national runner-up in the National Game Design Championship with Garry’s Escape, an educational physics and chemistry game. - Attended the India Game Developer Conference (IGDC) as a fully-sponsored delegate, where he met industry leaders like Nikhil Malankar. - Interned at Lighthouse Learning Digital Labs and serves as Lead Website Developer for CENMUN. - Organized and won several MUNs across Nagpur from Grade 6–12, including GLOMUN (the largest private MUN in the city), where he served as Director General and donated 50% of event profits to charity. - Runs a YouTube channel with over 4,000 subscribers and manages a Discord community of 3,000+ members centered on modding and gaming. - Scored 95% in school academics and is a Principal’s Scholar. Recepient of the prestigious Gold Crest Award. Wrote a research paper on AI literacy in Rural India. Harshit’s long-term goal is to empower underrepresented communities by teaching them how to leverage technology and AI tools available even on their mobile devices. When Harshit isn’t coding, you’ll find him in the gym, playing tennis, participating in MUNs, or spending time with friends. Your role: - Answer all questions as if you are representing Harshit. - Be informative, warm, and authentic — like a digital version of him. - If asked about personal preferences, experiences, or achievements, use the details above. - If asked something unrelated or unknown, politely respond that the information isn’t available yet. - Always keep answers fact-based and consistent with Harshit’s background and goals. DON'T CREATE FALSE INFORMATION`;

            const chatBox = document.getElementById('chat-box');
            const userInput = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');

            let isThinking = false;
            let conversationHistory = [];

            const addMessage = (content, sender) => {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('chat-message', sender);
                const contentDiv = document.createElement('div');
                contentDiv.classList.add('message-content');
                contentDiv.textContent = content;
                messageDiv.appendChild(contentDiv);
                chatBox.appendChild(messageDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
                return contentDiv;
            };

            const toggleInputState = (state) => {
                isThinking = state;
                userInput.disabled = state;
                sendBtn.disabled = state;
            };

            const callGeminiAPI = async () => {
                if (isThinking) return;

                const userText = userInput.value.trim();
                if (!userText) return;

                toggleInputState(true);
                addMessage(userText, 'user');
                userInput.value = '';
                conversationHistory.push({ role: 'user', parts: [{ text: userText }] });

                const aiMessageContent = addMessage('', 'ai');
                aiMessageContent.classList.add('blinking-cursor');

                let fullResponse = "";

                try {
                    // Pass the request through our secure Cloudflare proxy instead of Google directly.
                    // The proxy securely injects the API key so it is never exposed in the browser!
                    const apiURL = `${WORKER_URL}/v1beta/models/${MODEL_NAME}:streamGenerateContent?alt=sse`;

                    const requestBody = {
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        contents: conversationHistory,
                        safetySettings: [
                            { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                            { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                            { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                            { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" },
                        ],
                        generationConfig: { maxOutputTokens: 2000, temperature: 0.7 }
                    };

                    const response = await fetch(apiURL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestBody)
                    });

                    if (!response.ok) {
                        throw new Error(`API Error: ${response.status} ${response.statusText}`);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value);
                        const lines = chunk.split('\n');

                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const jsonStr = line.substring(6).trim();
                                if (jsonStr) {
                                    try {
                                        const parsed = JSON.parse(jsonStr);
                                        const textChunk = parsed.candidates[0].content.parts[0].text;
                                        fullResponse += textChunk;
                                        aiMessageContent.textContent = fullResponse;
                                        chatBox.scrollTop = chatBox.scrollHeight;
                                    } catch (e) {
                                        console.error("Could not parse JSON chunk:", jsonStr);
                                    }
                                }
                            }
                        }
                    }

                    conversationHistory.push({ role: 'model', parts: [{ text: fullResponse }] });

                } catch (error) {
                    console.error("Gemini API Error:", error);
                    aiMessageContent.textContent = "Sorry, the AI is currently unavailable. Please try again later.";
                } finally {
                    aiMessageContent.classList.remove('blinking-cursor');
                    toggleInputState(false);
                    userInput.focus();
                }
            };

            const initializeChat = () => {
                const greeting = "Hello! I'm HarshitGPT, an AI assistant built by Harshit. Feel free to ask me anything about his work, skills, or projects.";
                addMessage(greeting, 'ai');
                conversationHistory.push({ role: 'model', parts: [{ text: greeting }] });
            };

            sendBtn.addEventListener('click', callGeminiAPI);
            userInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') { callGeminiAPI(); }
            });

            initializeChat();
            userInput.focus();
        });
    </script>
</body>

</html>
