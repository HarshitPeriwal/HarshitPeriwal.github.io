<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Literacy Course</title>
    <link rel="stylesheet" href="ai-literacy.css">
</head>
<body>
    <main class="main-container">
        <div id="language-selection">
            <h1>Choose Your Language</h1>
            <button id="lang-en">English</button>
            <button id="lang-hi">हिंदी</button>
            <button id="lang-mr">मराठी</button>
        </div>

        <div id="course-content" style="display: none;">
            <h1 id="course-title">AI Literacy Course</h1>
            <div id="topics">
            </div>
        </div>

        <div id="certificate" style="display: none;">
            <h2>Congratulations!</h2>
            <p>You have successfully completed the AI Literacy Course.</p>
            <input type="text" id="name-input" placeholder="Enter your name for the certificate">
            <button id="generate-certificate">Generate Certificate</button>
            <div id="certificate-output"></div>
        </div>
    </main>
    <script src="ai-literacy.js"></script>
</body>
</html>
